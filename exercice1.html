<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription à une formation</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<h1 class="titre-formulaire">
    Formulaire d'inscription à une formation
</h1>

<form>
    <div class="groupes">


        <div>
            <h3>Informations personnelles</h3>

            <label for="nom">Nom :</label>
            <input type="text" id="nom" placeholder="Votre nom" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" placeholder="Votre prénom" required>

            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" required>

            <label for="date">Date de naissance :</label>
            <input type="date" id="date">

            <label for="tel">Téléphone :</label>
            <input type="tel" id="tel" placeholder="0600000000">

            <label for="age">Âge :</label>
            <input type="number" id="age" min="18" max="60">

            <p class="sous-titre">Sexe :</p>

            <div class="choix">
                <label>
                    <input type="radio" name="sexe" value="Homme">
                    Homme
                </label>

                <label>
                    <input type="radio" name="sexe" value="Femme">
                    Femme
                </label>
            </div>
        </div>

        <div>
            <h3>Formation</h3>

            <label for="niveau">Niveau d'étude :</label>
            <select id="niveau">
                <option value="">Choisir</option>
                <option>1re année</option>
                <option>2e année</option>
                <option>3e année</option>
            </select>

            <label for="filiere">Filière :</label>
            <select id="filiere" required>
                <option value="">Choisir une filière</option>
                <option>Génie informatique</option>
                <option>Réseaux et télécommunication</option>
                <option>IA</option>
                <option>Cyber Security</option>
            </select>
        </div>

        <div>
            <h3>Compétences</h3>

            <p class="sous-titre">Technologies maîtrisées :</p>

            <div class="choix-colonne">
                <label><input type="checkbox" id="html"> HTML</label>
                <label><input type="checkbox" id="css"> CSS</label>
                <label><input type="checkbox" id="js"> JavaScript</label>
                <label><input type="checkbox" id="python"> Python</label>
            </div>

            <p class="sous-titre">Domaines d'intérêt :</p>

            <div class="choix-colonne">
                <label><input type="checkbox" id="web"> Développement Web</label>
                <label><input type="checkbox" id="reseaux"> Réseaux</label>
                <label><input type="checkbox" id="cyber"> Cybersécurité</label>
                <label><input type="checkbox" id="ia"> Intelligence artificielle</label>
            </div>

            <label for="motivation">Motivation :</label>
            <textarea id="motivation" rows="4"></textarea>

            <label for="cv">Télécharger votre CV :</label>
            <input type="file" id="cv">
        </div>

    </div>

    <div class="boutons">
        <input type="submit" value="S'inscrire">
        <input type="reset" value="Réinitialiser">
    </div>
</form>

</body>
</html>
